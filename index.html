<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Jokenpô do PH</title>
</head>

<body>
    <div class="container">
        <h1>Jokenpô</h1>

        <div class="buttons">
        <button id="rock" onclick="playHuman('rock')">&#x270A;&#xFE0F;</button>
        <button id="paper" onclick="playHuman('paper')">&#x1F590;&#xFE0F;</button>
        <button id="scissors" onclick="playHuman('scissors')">&#x270C;&#xFE0F;</button>
        <!--  &#xFE0F; Força a exibição do símbolo como emoji colorido quando suportado -->
        </div>

        <p class="result"></p>
        <p class="userScore">Sua Pontuação: <span id="humanScore">0</span></p>
        <p class="computerScore">Pontuação do Computador: <span id="computerScore">0</span></p>

    </div>
    <script src="script.js"></script>
</body>

</html>
